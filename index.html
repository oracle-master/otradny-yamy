<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Карта ям Отрадного</title>
    <meta name="theme-color" content="#1a1a2e">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .header {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 10px 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0e8ff 0%, #a098c0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 600;
            color: #e0d8f0;
            white-space: nowrap;
        }

        .header-badge.online { color: #7dffa0; border-color: rgba(125, 255, 160, 0.4); }
        .header-badge.offline { color: #ff8a8a; border-color: rgba(255, 138, 138, 0.4); }

        .search-box { display: flex; gap: 6px; }

        .search-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder { color: #8a80a8; }
        .search-input:focus { border-color: rgba(160, 152, 192, 0.6); }

        .search-btn {
            background: linear-gradient(135deg, #6a5acd 0%, #483d8b 100%);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        #map {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bottom-panel {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 1000;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #fff;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .stats { display: flex; flex-direction: column; gap: 2px; }

        .stats-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8a80a8;
        }

        .stats-value {
            font-size: 22px;
            font-weight: 700;
            color: #f0e8ff;
        }

        .add-btn {
            background: linear-gradient(135deg, #6a5acd 0%, #483d8b 100%);
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid rgba(255, 71, 87, 0.5);
            color: #ff6b7a;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .locate-btn {
            background: transparent;
            border: 1px solid rgba(66, 133, 244, 0.5);
            color: #7aa7ff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Маркер ямы */
        .pothole-marker {
            background: #ff4757;
            border: 3px solid #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 71, 87, 0.8); }
            50% { box-shadow: 0 0 25px rgba(255, 71, 87, 1); }
        }

        /* Маркер-черновик (мигает) */
        .draft-marker {
            background: #ffa502;
            border: 3px solid #fff;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            box-shadow: 0 0 20px rgba(255, 165, 2, 1);
            animation: draftPulse 1s infinite;
        }

        @keyframes draftPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }

        /* Синяя капля */
        .my-location-marker {
            background: #4285f4;
            border: 3px solid #fff;
            border-radius: 50% 50% 50% 0;
            width: 24px;
            height: 24px;
            transform: rotate(-45deg);
            box-shadow: 0 0 15px rgba(66, 133, 244, 0.8);
            position: relative;
        }

        .my-location-marker::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        /* Уведомление */
        .toast {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            z-index: 2000;
            background: rgba(26, 26, 46, 0.95);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(160, 152, 192, 0.5);
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Подсказка */
        .hint {
            position: absolute;
            top: 125px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(26, 26, 46, 0.9);
            color: #e0d8f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(160, 152, 192, 0.3);
            transition: opacity 0.5s;
            white-space: nowrap;
        }

        .hint.hidden { opacity: 0; pointer-events: none; }

        /* ===== ПАНЕЛЬ ЧЕРНОВИКА ===== */
        .draft-panel {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 1500;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #fff;
            padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
            box-shadow: 0 -6px 30px rgba(0, 0, 0, 0.6);
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .draft-panel.show { transform: translateY(0); }

        .draft-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffa502;
        }

        .draft-subtitle {
            font-size: 12px;
            color: #8a80a8;
            margin-bottom: 12px;
        }

        .draft-buttons {
            display: flex;
            gap: 10px;
        }

        .draft-btn-save {
            flex: 1;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .draft-btn-cancel {
            flex: 1;
            background: transparent;
            border: 2px solid rgba(255, 71, 87, 0.6);
            color: #ff6b7a;
            padding: 14px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ===== ОКНО ОПИСАНИЯ ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1e 100%);
            border: 1px solid rgba(160, 152, 192, 0.4);
            border-radius: 20px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            color: #fff;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f0e8ff;
        }

        .modal-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            margin-bottom: 14px;
        }

        .modal-input::placeholder { color: #6a6088; }
        .modal-input:focus { border-color: rgba(160, 152, 192, 0.6); }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn-ok {
            flex: 1;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-btn-skip {
            flex: 1;
            background: transparent;
            border: 1px solid rgba(160, 152, 192, 0.4);
            color: #a098c0;
            padding: 12px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <div class="header-title">🗺️ Карта ям Отрадного</div>
            <div class="header-badge" id="headerBadge">Подключение...</div>
        </div>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Ленина 15, школа №5, Озон...">
            <button class="search-btn" id="searchBtn">🔍</button>
        </div>
    </div>

    <div class="hint" id="hint">Нажми «+ Добавить яму» и ткни в карту</div>

    <div id="map"></div>

    <!-- Обычная нижняя панель -->
    <div class="bottom-panel" id="bottomPanel">
        <div class="panel-row">
            <div class="stats">
                <div class="stats-label">Ям на карте</div>
                <div class="stats-value" id="potholeCount">0</div>
            </div>
            <button class="add-btn" id="addBtn">+ Добавить яму</button>
        </div>
        <div class="panel-row">
            <button class="clear-btn" id="clearBtn">🗑 Очистить мои</button>
            <button class="locate-btn" id="locateBtn">📍 Я здесь</button>
        </div>
    </div>

    <!-- Панель черновика -->
    <div class="draft-panel" id="draftPanel">
        <div class="draft-title">📍 Уточните местоположение</div>
        <div class="draft-subtitle">Перетащите маркер, увеличьте карту, потом сохраните</div>
        <div class="draft-buttons">
            <button class="draft-btn-cancel" id="draftCancel">✕ Отмена</button>
            <button class="draft-btn-save" id="draftSave">✅ Сохранить</button>
        </div>
    </div>

    <!-- Модальное окно описания -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title">Что здесь за яма?</div>
            <input type="text" class="modal-input" id="modalInput" placeholder="Например: большая яма" maxlength="100">
            <div class="modal-buttons">
                <button class="modal-btn-skip" id="modalSkip">Пропустить</button>
                <button class="modal-btn-ok" id="modalOk">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== НАСТРОЙКИ SUPABASE =====
        var SUPABASE_URL = 'https://xmajdholmfhuizavwhmr.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_QF7Ss8n3vhlbe70iJv4tKA_2dy8ijnS';
        var TABLE_NAME = 'potholes';

        // ===== КООРДИНАТЫ ОТРАДНОГО =====
        var OTRADNY_CENTER = [53.378, 51.334];
        var OTRADNY_ZOOM = 14;
        var CITY_SUFFIX = ', Отрадный, Самарская область';

        // ===== ИНИЦИАЛИЗАЦИЯ КАРТЫ =====
        var map = L.map('map', { zoomControl: false }).setView(OTRADNY_CENTER, OTRADNY_ZOOM);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // ===== СОСТОЯНИЕ =====
        var potholes = [];
        var addingMode = false;
        var draftMarker = null;
        var myLocationMarker = null;
        var myLocationCircle = null;
        var searchMarker = null;

        // ===== ЭЛЕМЕНТЫ =====
        var addBtn = document.getElementById('addBtn');
        var clearBtn = document.getElementById('clearBtn');
        var locateBtn = document.getElementById('locateBtn');
        var potholeCountEl = document.getElementById('potholeCount');
        var toastEl = document.getElementById('toast');
        var hintEl = document.getElementById('hint');
        var headerBadge = document.getElementById('headerBadge');
        var searchInput = document.getElementById('searchInput');
        var searchBtn = document.getElementById('searchBtn');
        var draftPanel = document.getElementById('draftPanel');
        var draftSave = document.getElementById('draftSave');
        var draftCancel = document.getElementById('draftCancel');
        var modalOverlay = document.getElementById('modalOverlay');
        var modalInput = document.getElementById('modalInput');
        var modalOk = document.getElementById('modalOk');
        var modalSkip = document.getElementById('modalSkip');

        // ===== ФУНКЦИИ =====
        function showToast(text) {
            toastEl.textContent = text;
            toastEl.classList.add('show');
            setTimeout(function() { toastEl.classList.remove('show'); }, 2500);
        }

        function updateCounter() {
            potholeCountEl.textContent = potholes.length;
        }

        function setOnline(isOnline) {
            if (isOnline) {
                headerBadge.textContent = 'В сети';
                headerBadge.className = 'header-badge online';
            } else {
                headerBadge.textContent = 'Оффлайн';
                headerBadge.className = 'header-badge offline';
            }
        }

        // ===== ГЕОЛОКАЦИЯ =====
        locateBtn.addEventListener('click', function() {
            if (!navigator.geolocation) {
                showToast('⚠️ Геолокация не поддерживается');
                return;
            }
            showToast('📍 Определяю...');
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    var accuracy = position.coords.accuracy;

                    if (myLocationMarker) map.removeLayer(myLocationMarker);
                    if (myLocationCircle) map.removeLayer(myLocationCircle);

                    var myIcon = L.divIcon({
                        className: '',
                        html: '<div class="my-location-marker"></div>',
                        iconSize: [24, 24],
                        iconAnchor: [12, 24]
                    });
                    myLocationMarker = L.marker([lat, lng], { icon: myIcon }).addTo(map);

                    myLocationCircle = L.circle([lat, lng], {
                        radius: accuracy,
                        color: '#4285f4',
                        fillColor: '#4285f4',
                        fillOpacity: 0.15,
                        weight: 1
                    }).addTo(map);

                    map.flyTo([lat, lng], 17, { duration: 1.5 });
                    showToast('📍 Найдено! Точность: ±' + Math.round(accuracy) + ' м');
                },
                function(error) {
                    var msg = '⚠️ Ошибка геолокации';
                    if (error.code === 1) msg = '⚠️ Разрешите доступ к геолокации';
                    if (error.code === 2) msg = '⚠️ Включите GPS на телефоне';
                    if (error.code === 3) msg = '⚠️ Превышено время';
                    showToast(msg);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });

        // ===== ПОИСК =====
        function searchAddress() {
            var query = searchInput.value.trim();
            if (!query) { showToast('⚠️ Введите адрес'); return; }
            if (searchMarker) map.removeLayer(searchMarker);

            showToast('🔍 Ищу...');
            var fullQuery = query + CITY_SUFFIX;
            var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(fullQuery);

            fetch(url, { headers: { 'Accept-Language': 'ru' } })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (data.length === 0) { showToast('⚠️ Адрес не найден'); return; }
                var first = data[0];
                var lat = parseFloat(first.lat);
                var lng = parseFloat(first.lon);

                searchMarker = L.marker([lat, lng], {
                    icon: L.divIcon({
                        className: '',
                        html: '<div style="background:#4285f4;border:3px solid #fff;border-radius:50%;width:18px;height:18px;box-shadow:0 0 15px rgba(66,133,244,0.8);"></div>',
                        iconSize: [18, 18],
                        iconAnchor: [9, 9]
                    })
                }).addTo(map);
                searchMarker.bindPopup('<b>' + first.display_name + '</b>').openPopup();
                map.flyTo([lat, lng], 17, { duration: 1.5 });
                showToast('✅ Найдено: ' + first.display_name.split(',')[0]);
            })
            .catch(function(error) {
                console.error(error);
                showToast('⚠️ Ошибка поиска');
            });
        }

        searchBtn.addEventListener('click', searchAddress);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchAddress();
        });

        // ===== ЗАГРУЗКА ЯМ =====
        function loadFromCloud() {
            fetch(SUPABASE_URL + '/rest/v1/' + TABLE_NAME + '?select=*&order=created_at.desc', {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY
                }
            })
            .then(function(response) {
                if (!response.ok) throw new Error('Ошибка загрузки: ' + response.status);
                return response.json();
            })
            .then(function(data) {
                potholes.forEach(function(p) { if (p.marker) map.removeLayer(p.marker); });
                potholes = [];

                data.forEach(function(row) {
                    var marker = createMarker(row.lat, row.lng, row.description, row.id);
                    potholes.push({
                        id: row.id, lat: row.lat, lng: row.lng,
                        description: row.description, marker: marker
                    });
                });

                updateCounter();
                setOnline(true);
                showToast('☁️ Загружено ям: ' + potholes.length);
            })
            .catch(function(error) {
                console.error('Ошибка загрузки:', error);
                setOnline(false);
                showToast('⚠️ Не удалось загрузить ямы');
            });
        }

        // ===== СОХРАНЕНИЕ ЯМЫ =====
        function saveToCloud(lat, lng, description) {
            return fetch(SUPABASE_URL + '/rest/v1/' + TABLE_NAME, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({
                    lat: lat, lng: lng, description: description
                })
            })
            .then(function(response) {
                if (!response.ok) throw new Error('Ошибка сохранения: ' + response.status);
                return response.json();
            })
            .then(function(data) { return data[0]; });
        }

        // ===== УДАЛЕНИЕ =====
        function deleteFromCloud(id) {
            return fetch(SUPABASE_URL + '/rest/v1/' + TABLE_NAME + '?id=eq.' + id, {
                method: 'DELETE',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY
                }
            });
        }

        // ===== СОЗДАНИЕ МАРКЕРА =====
        function createMarker(lat, lng, description, id) {
            var icon = L.divIcon({
                className: '',
                html: '<div class="pothole-marker"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            var marker = L.marker([lat, lng], { icon: icon }).addTo(map);
            var popupContent =
                '<div style="min-width: 180px;">' +
                    '<b>' + description + '</b><br>' +
                    '<small style="color: #888;">' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '</small><br>' +
                    '<button onclick="deletePothole(' + id + ')" ' +
                    'style="margin-top: 8px; background: #ff4757; color: white; border: none; ' +
                    'padding: 6px 12px; border-radius: 15px; font-size: 12px; cursor: pointer;">' +
                    '🗑 Удалить</button>' +
                '</div>';
            marker.bindPopup(popupContent);
            return marker;
        }

        // ===== УДАЛЕНИЕ ЯМЫ =====
        window.deletePothole = function(id) {
            if (!confirm('Удалить эту яму?')) return;
            deleteFromCloud(id)
                .then(function() {
                    var index = potholes.findIndex(function(p) { return p.id === id; });
                    if (index !== -1) {
                        map.removeLayer(potholes[index].marker);
                        potholes.splice(index, 1);
                    }
                    updateCounter();
                    showToast('🗑 Яма удалена');
                })
                .catch(function(error) {
                    console.error(error);
                    showToast('⚠️ Не удалось удалить');
                });
        };

        // ===== ДОБАВЛЕНИЕ ЯМЫ (вкл/выкл режима) =====
        addBtn.addEventListener('click', function() {
            addingMode = !addingMode;
            if (addingMode) {
                addBtn.textContent = '✕ Отмена';
                addBtn.style.background = 'linear-gradient(135deg, #ff4757 0%, #c0392b 100%)';
                hintEl.classList.remove('hidden');
                hintEl.textContent = 'Ткни в карту в месте ямы';
            } else {
                addBtn.textContent = '+ Добавить яму';
                addBtn.style.background = 'linear-gradient(135deg, #6a5acd 0%, #483d8b 100%)';
                hintEl.classList.add('hidden');
            }
        });

        // ===== КЛИК ПО КАРТЕ → ЧЕРНОВИК =====
        map.on('click', function(e) {
            if (!addingMode) return;

            // Убираем старый черновик, если есть
            if (draftMarker) map.removeLayer(draftMarker);

            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            // Создаём черновик (перетаскиваемый)
            var draftIcon = L.divIcon({
                className: '',
                html: '<div class="draft-marker"></div>',
                iconSize: [26, 26],
                iconAnchor: [13, 13]
            });

            draftMarker = L.marker([lat, lng], {
                icon: draftIcon,
                draggable: true
            }).addTo(map);

            // Показываем панель
            draftPanel.classList.add('show');

            // Выключаем режим добавления
            addingMode = false;
            addBtn.textContent = '+ Добавить яму';
            addBtn.style.background = 'linear-gradient(135deg, #6a5acd 0%, #483d8b 100%)';
            hintEl.classList.add('hidden');
        });

        // ===== ОТМЕНА ЧЕРНОВИКА =====
        draftCancel.addEventListener('click', function() {
            if (draftMarker) {
                map.removeLayer(draftMarker);
                draftMarker = null;
            }
            draftPanel.classList.remove('show');
            showToast('Отменено');
        });

        // ===== СОХРАНЕНИЕ ЧЕРНОВИКА =====
        draftSave.addEventListener('click', function() {
            if (!draftMarker) return;

            var lat = draftMarker.getLatLng().lat;
            var lng = draftMarker.getLatLng().lng;

            // Показываем окно описания
            modalInput.value = '';
            modalOverlay.classList.add('show');
            setTimeout(function() { modalInput.focus(); }, 100);

            // Сохраняем координаты во временную переменную
            window._draftCoords = { lat: lat, lng: lng };
        });

        // ===== МОДАЛЬНОЕ ОКНО — ОК =====
        modalOk.addEventListener('click', function() {
            var description = modalInput.value.trim() || 'Яма';
            modalOverlay.classList.remove('show');
            finalizeDraft(window._draftCoords.lat, window._draftCoords.lng, description);
        });

        // ===== МОДАЛЬНОЕ ОКНО — ПРОПУСТИТЬ =====
        modalSkip.addEventListener('click', function() {
            modalOverlay.classList.remove('show');
            finalizeDraft(window._draftCoords.lat, window._draftCoords.lng, 'Яма');
        });

        // Enter в модальном окне
        modalInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') modalOk.click();
        });

        // ===== ФИНАЛИЗАЦИЯ ЧЕРНОВИКА =====
        function finalizeDraft(lat, lng, description) {
            saveToCloud(lat, lng, description)
                .then(function(row) {
                    // Убираем черновик
                    if (draftMarker) {
                        map.removeLayer(draftMarker);
                        draftMarker = null;
                    }
                    draftPanel.classList.remove('show');

                    // Создаём постоянный маркер
                    var marker = createMarker(row.lat, row.lng, row.description, row.id);
                    potholes.push({
                        id: row.id, lat: row.lat, lng: row.lng,
                        description: row.description, marker: marker
                    });
                    updateCounter();
                    showToast('✅ Яма сохранена');
                })
                .catch(function(error) {
                    console.error(error);
                    showToast('⚠️ Не удалось сохранить');
                });
        }

        // ===== ОЧИСТИТЬ МОИ =====
        clearBtn.addEventListener('click', function() {
            if (potholes.length === 0) { showToast('Карта уже пустая'); return; }
            if (!confirm('Скрыть все ямы с этой карты?\n(В облаке они останутся)')) return;
            potholes.forEach(function(p) { map.removeLayer(p.marker); });
            potholes = [];
            updateCounter();
            showToast('Скрыто с карты');
        });

        // ===== ЗАПУСК =====
        loadFromCloud();
        setTimeout(function() { hintEl.classList.add('hidden'); }, 5000);
    </script>

</body>
</html>
